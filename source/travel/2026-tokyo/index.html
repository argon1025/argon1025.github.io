<title>2026 Tokyo</title>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root{
  --accent-blue:#0099ff;--accent-blue-ring:rgba(0,153,255,.15);
  --gradient-violet:#7c5cff;--gradient-magenta:#e0399b;--gradient-orange:#ff7a3d;--gradient-coral:#ff5a6e;
  --brand-coral:var(--gradient-coral);--brand-purple:var(--gradient-violet);
  --canvas:#0a0908;--surface:#181818;--surface-2:#242424;--surface-soft:#121110;
  --hairline:rgba(255,255,255,.10);--hairline-soft:rgba(255,255,255,.06);
  --ink:#fff;--ink-strong:#fff;--ink-muted:#999;--primary:#fff;
  --charcoal:#999;--slate:#999;--steel:#999;--stone:#6b6b6b;--on-primary:#0a0908;
  --r-md:8px;--r-lg:12px;--r-xl:16px;--r-xxl:20px;--r-xxxl:24px;--r-hero:32px;--r-full:9999px;
  --s-xs:8px;--s-sm:12px;--s-md:16px;--s-lg:20px;--s-xl:24px;--s-xxl:32px;--s-xxxl:40px;
  --s-section:64px;--s-hero:96px;
  --shadow-2:rgba(255,255,255,.10) 0px .5px 0px 0px inset,rgba(0,0,0,.25) 0px 10px 30px 0px;
  --shadow-4:rgba(255,255,255,.10) 0px .5px 0px 0px inset,rgba(0,0,0,.35) 0px 12px 30px -4px;
  --font:"Inter",system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-display:"Mona Sans","Inter",system-ui,"Helvetica Neue",Arial,sans-serif;
  --nav-h:66px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:16px;line-height:1.5;color:var(--ink);background:var(--canvas);
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv01","cv05","cv09","cv11","ss03","ss07","dlig";
  font-variant-ligatures:discretionary-ligatures}
img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--s-md)}
.t-hero{font:500 80px/0.95 var(--font-display);letter-spacing:-4px}
.t-heading-lg{font:500 40px/1.1 var(--font-display);letter-spacing:-1.8px}
.t-heading-md{font:500 32px/1.13 var(--font-display);letter-spacing:-1px}
.t-heading-sm{font:500 24px/1.2 var(--font-display);letter-spacing:-.6px}
.t-card-title{font:600 20px/1.3 var(--font);letter-spacing:-.5px}
.t-subtitle{font:400 18px/1.3 var(--font);letter-spacing:-.18px}
.t-body-md{font:400 16px/1.4 var(--font);letter-spacing:-.16px}
.t-body-sm{font:400 14px/1.4 var(--font);letter-spacing:-.14px}
.t-micro{font:400 12px/1.3 var(--font);letter-spacing:-.12px}
.leaflet-div-icon.marker-pin{background:transparent;border:none}
/* Leaflet 다크 팝업 */
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-2)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content a{color:var(--accent-blue)}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink-muted)}
.leaflet-control-attribution{background:rgba(10,9,8,.7);color:var(--ink-muted)}
.leaflet-control-attribution a{color:var(--ink-muted)}

/* 히어로 — gradient spotlight 카드(DESIGN 시그너처): 다크 캔버스 위 violet→magenta→coral 발광 */
.hero{margin:var(--s-xl) 0 var(--s-lg);}
.hero-card{position:relative;overflow:hidden;color:#fff;border-radius:var(--r-hero);
  padding:var(--s-hero) var(--s-xl);text-align:center;
  background:radial-gradient(120% 120% at 20% 0%,var(--gradient-violet) 0%,var(--gradient-magenta) 55%,var(--gradient-coral) 115%)}
.hero-card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(100% 70% at 80% 110%,rgba(255,122,61,.4),transparent 60%)}
.hero-card h1{margin:0;color:#fff;position:relative}
.hero-tag{margin-top:var(--s-md);opacity:.92;position:relative}

/* 선택 네비 (sticky) — 레퍼런스 날짜 헤더 톤. 가로 스크롤. */
.trip-nav{position:sticky;top:0;z-index:30;display:flex;gap:var(--s-xs);align-items:stretch;
  background:rgba(10,9,8,.8);backdrop-filter:saturate(140%) blur(8px);
  padding:var(--s-sm) 2px;margin-bottom:var(--s-md);border-bottom:1px solid var(--hairline-soft);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.nav-item{flex:0 0 auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:64px;background:transparent;border:none;border-radius:var(--r-md);
  padding:6px 12px 8px;font-family:var(--font);color:var(--stone);position:relative}
.nav-item .nav-kicker{font:600 11px var(--font);letter-spacing:.3px;text-transform:uppercase;color:var(--stone)}
.nav-item .nav-label{font:600 15px/1.2 var(--font);color:var(--steel);white-space:nowrap;max-width:160px;
  overflow:hidden;text-overflow:ellipsis}
.nav-item[aria-selected="true"] .nav-kicker{color:var(--accent-blue)}
.nav-item[aria-selected="true"] .nav-label{color:var(--ink)}
.nav-item[aria-selected="true"]::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  bottom:-1px;width:22px;height:3px;border-radius:var(--r-full);background:var(--accent-blue)}
.nav-item:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.view[hidden]{display:none}

/* 카드 공통 */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-xl);
  padding:var(--s-xl);margin-bottom:var(--s-md)}

/* 체크리스트 */
.topic-title{margin:0 0 var(--s-sm)}
.check-row{display:flex;align-items:center;gap:var(--s-sm);min-height:44px;padding:2px 0;cursor:pointer}
.check-row input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent-blue)}
.check-row.done span{color:var(--stone);text-decoration:line-through}

/* 일정 인트로 */
.itin-intro{margin:var(--s-md) 0 var(--s-lg)}
.itin-intro .it-title{margin:0;color:var(--ink)}
.itin-intro .it-sub{color:var(--slate);margin-top:4px}
.itin-intro .it-desc{color:var(--charcoal);margin-top:var(--s-sm);white-space:pre-wrap}

/* 일정 view 레이아웃: 기본(모바일)=세로(지도 상단), 데스크톱=좌 일정 / 우 지도 */
.itin-cols{display:flex;flex-direction:column}
.itin-cols .map-sticky{order:-1}
.itin-main{min-width:0}

/* 지도 (보조) — sticky: 네비 바로 아래 고정 */
.map-sticky{position:sticky;top:var(--nav-h);z-index:5;padding-top:2px;padding-bottom:var(--s-sm);
  background:var(--canvas)}
.itin-map{height:38vh;min-height:240px;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--hairline);box-shadow:var(--shadow-2)}
.map-hint{color:var(--steel);font-size:12px;text-align:center;padding:6px 0 2px}
.no-map{color:var(--steel);padding:var(--s-md);text-align:center}

/* 세로 타임라인 (메인) */
.timeline{padding-top:var(--s-sm)}
.tl-item{position:relative;display:flex;gap:var(--s-md);padding-bottom:var(--s-md)}
.tl-rail{flex:0 0 22px;position:relative;display:flex;justify-content:center}
/* 연결선: 노드 중심(top 13px)부터 다음 아이템까지. 마지막 아이템은 트림. */
.tl-rail::before{content:"";position:absolute;top:0;bottom:calc(-1 * var(--s-md));left:50%;
  transform:translateX(-50%);width:2px;background:var(--hairline)}
.tl-item:first-child .tl-rail::before{top:13px}
.tl-item:last-child .tl-rail::before{display:none}
.tl-node{position:relative;z-index:1;margin-top:7px;width:13px;height:13px;border-radius:var(--r-full);
  background:var(--surface-2);border:3px solid var(--ink-muted)}
/* 카드: surface-1 + hairline(DESIGN card 기본). 좌측 액센트만 강조색. */
.tl-card{flex:1;min-width:0;border-radius:var(--r-lg);background:var(--surface);
  border:1px solid var(--hairline);padding:var(--s-md) var(--s-lg);text-align:left;font-family:var(--font);
  border-left:3px solid var(--ink-muted)}
button.tl-card{cursor:pointer;width:100%;transition:box-shadow .16s ease}
button.tl-card:hover{box-shadow:var(--shadow-2)}
button.tl-card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tl-card.note{background:var(--surface-soft);border-style:dashed;border-left-style:solid}
.tl-head{display:flex;align-items:center;gap:var(--s-xs)}
.num{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
  padding:0 7px;border-radius:var(--r-full);background:var(--primary);color:var(--on-primary);font:600 12px var(--font)}
.num.opt{background:var(--gradient-violet);color:#fff}
.emoji{flex:0 0 auto;font-size:18px}
.tl-title{flex:1;min-width:0;font:600 14px/1.4 var(--font);color:var(--ink)}
.tl-card.note .tl-title{font-weight:500;color:var(--slate)}
.locate{flex:0 0 auto;color:var(--steel);font-size:16px}
.chip{flex:0 0 auto;font:600 12px var(--font);color:var(--slate);background:var(--surface);
  border:1px solid var(--hairline);border-radius:var(--r-full);padding:2px 8px}
.chip.dur{color:var(--charcoal);background:var(--surface-soft)}
.badge-approx{flex:0 0 auto;font:500 12px var(--font);color:var(--ink-muted);background:var(--surface-2);
  border-radius:var(--r-full);padding:1px 8px}
.tl-detail{margin-top:var(--s-xs)}
.memo{color:var(--charcoal);font-size:14px;margin-top:4px;white-space:pre-wrap}
.tags{color:var(--slate);font-size:12px;margin-top:4px}
.meta{color:var(--slate);font-size:13px;margin-top:4px}
.cand{border-top:1px solid var(--hairline-soft);padding-top:var(--s-xs);margin-top:var(--s-xs)}
.cand-title{font:600 14px var(--font);color:var(--ink)}

/* 구글맵 버튼 — 지도 팝업 전용. charcoal pill(DESIGN secondary), 컴팩트 */
.gmap-btn{display:inline-flex;align-items:center;gap:5px;margin-top:var(--s-sm);
  background:var(--surface-2);color:var(--ink);border:1px solid transparent;text-decoration:none;
  border-radius:var(--r-full);padding:6px 14px;font:600 13px/1.3 var(--font)}
.gmap-btn.sm{padding:5px 12px;font-size:12px}

footer{color:var(--ink-muted);text-align:center;padding:var(--s-section) 0 var(--s-xxl)}

@media (max-width:767px){
  .wrap{padding:0 var(--s-sm)}
  .t-hero{font-size:40px;letter-spacing:-1px}
  .t-heading-lg{font-size:28px}
  .t-heading-md{font-size:24px}
  .hero-card{padding:var(--s-section) var(--s-md)}
  .itin-map{height:34vh;min-height:220px}
  .nav-item{min-width:56px;padding:6px 10px 8px}
  .nav-item .nav-label{font-size:14px;max-width:120px}
  .tl-rail{flex:0 0 18px}
  .tl-card{padding:var(--s-sm)}
  .check-row input{width:24px;height:24px}
}

/* 데스크톱: 일정 = 좌(타임라인) / 우(지도) 2단, 지도는 우측에서 뷰포트 높이로 sticky */
@media (min-width:880px){
  .itin-cols{flex-direction:row;align-items:flex-start;gap:var(--s-xl)}
  .itin-main{flex:0 0 350px;width:350px;min-width:0}
  .itin-cols .map-sticky{order:0;flex:1;min-width:0;padding-bottom:0}
  .itin-cols .itin-map{height:calc(100vh - var(--nav-h) - var(--s-xl));min-height:480px}
}
</style>
</head>

,"mode":"","durationMin":null}},{"blockId":"Ot0_3rVdZgDrIVvMYh_hX","lat":35.7114824,"lng":139.7985759,"icon":"stop","number":3,"emoji":"🍚","popup":{"kind":"stop","title":"우시미츠 (소고기 덮밥)","approx":false,"memo":"","tags":[],"url":"https://www.google.com/maps/place/%EC%9A%B0%EC%8B%9C%EB%AF%B8%EC%B8%A0+(%EC%86%8C%EA%B3%A0%EA%B8%B0+%EB%8D%AE%EB%B0%A5)/data=!4m2!3m1!1s0x60188f007a2b3891:0xb7744e2fd2f43198","durationMin":null}},{"blockId":"w7R9llKO-N5grTj3QNanH","lat":35.7111828,"lng":139.7976164,"icon":"optionCand","number":4,"emoji":"🍖","popup":{"kind":"stop","title":"이치란 아사쿠사점","approx":false,"memo":"","tags":[],"optionLabel":"아사쿠사 구경","url":"https://www.google.com/maps/place/%EC%9D%B4%EC%B9%98%EB%9E%80+%EC%95%84%EC%82%AC%EC%BF%A0%EC%82%AC%EC%A0%90/data=!4m2!3m1!1s0x60188ec6be01feef:0x9736b3e4d24be9de","durationMin":60}},{"blockId":"w7R9llKO-N5grTj3QNanH","lat":35.7112375,"lng":139.7954263,"icon":"optionCand","number":4,"emoji":"🍰","popup":{"kind":"stop","title":"아사쿠사 실크푸딩 본점","approx":false,"memo":"","tags":[],"optionLabel":"아사쿠사 구경","url":"https://www.google.com/maps/place/%EC%95%84%EC%82%AC%EC%BF%A0%EC%82%AC+%EC%8B%A4%ED%81%AC%ED%91%B8%EB%94%A9+%EB%B3%B8%EC%A0%90/data=!4m2!3m1!1s0x60188ec72c4a0e19:0x737062362897c32c","durationMin":60}},{"blockId":"w7R9llKO-N5grTj3QNanH","lat":35.7124372,"lng":139.7970903,"icon":"optionCand","number":4,"emoji":"🛍️","popup":{"kind":"stop","title":"Monchhichi Gallery","approx":false,"memo":"","tags":[],"optionLabel":"아사쿠사 구경","url":"https://www.google.com/maps/place/Monchhichi+Gallery/data=!4m2!3m1!1s0x60188ec135e8b64b:0xa0f5af924f61d4eb","durationMin":60}},{"blockId":"GEKLM_kxP5odc2N5crCzs","lat":35.71007121727086,"lng":139.81070280075076,"icon":"stop","number":5,"emoji":"🖼️","popup":{"kind":"stop","title":"스카이트리","approx":false,"memo":"","tags":[],"url":"https://maps.app.goo.gl/xtztNXeUq17jh6CGA","durationMin":null}},{"blockId":"XFgptnwMha8Gk9kOtOtd8","lat":35.740124608635426,"lng":140.0975121503754,"icon":"note","number":null,"emoji":"🚶","popup":{"kind":"note","emoji":"🚶","text":"[14:29] 액세스 특급 열차 탑승","mode":"기차","durationMin":70}},{"blockId":"Bdv7BO5ghVPfDhnw2pTfg","lat":35.770178,"lng":140.3843215,"icon":"stop","number":6,"emoji":"✈️","popup":{"kind":"stop","title":"나리타 국제 공항","approx":false,"memo":"[18:25] 출발 (16:00 도착)","tags":[],"url":"https://www.google.com/maps/place/%EB%82%98%EB%A6%AC%ED%83%80+%EA%B5%AD%EC%A0%9C+%EA%B3%B5%ED%95%AD/data=!4m2!3m1!1s0x6022f379d1bd3757:0xd56e29a162771aa1","durationMin":null}}],"optionConnectors":[[[35.7111828,139.7976164],[35.7112375,139.7954263],[35.7124372,139.7970903]]],"segments":[{"a":[35.7097797,139.7871645],"b":[35.7105797,139.7879645],"dashed":true},{"a":[35.7105797,139.7879645],"b":[35.7081274,139.7864764],"dashed":false},{"a":[35.7081274,139.7864764],"b":[35.7098049,139.79252615000001],"dashed":true},{"a":[35.7098049,139.79252615000001],"b":[35.7114824,139.7985759],"dashed":true},{"a":[35.7114824,139.7985759],"b":[35.711619166666665,139.796711],"dashed":false},{"a":[35.711619166666665,139.796711],"b":[35.71007121727086,139.81070280075076],"dashed":false},{"a":[35.71007121727086,139.81070280075076],"b":[35.740124608635426,140.0975121503754],"dashed":true},{"a":[35.740124608635426,140.0975121503754],"b":[35.770178,140.3843215],"dashed":true}],"bounds":[[35.7097797,139.7871645],[35.7105797,139.7879645],[35.7081274,139.7864764],[35.7098049,139.79252615000001],[35.7114824,139.7985759],[35.711619166666665,139.796711],[35.71007121727086,139.81070280075076],[35.740124608635426,140.0975121503754],[35.770178,140.3843215]]}]}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById("itin-data").textContent);
  var LS_PREFIX = "itin-export:" + DATA.name + ":";

  function esc(s){
    s = (s==null) ? "" : String(s);
    return s.replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }
  function el(tag, cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }
  function txt(tag, cls, s){ var e=el(tag, cls); e.textContent=(s==null?"":s); return e; }

  // ── 아이콘 빌더 (MapView 미러링, 리터럴 hex) ──
  function stopIcon(number, emoji, option){
    var bg = option ? "#7c5cff" : "#ffffff";
    var fg = option ? "#fff" : "#0a0908";
    var html = '<div style="display:inline-flex;align-items:center;gap:2px;transform:translate(-50%,-50%);'
      + 'background:'+bg+';color:'+fg+';border:2px solid #0a0908;border-radius:9999px;padding:2px 8px;'
      + "font:600 12px/1.2 'Inter',sans-serif;box-shadow:rgba(0,0,0,.4) 0 1px 4px;white-space:nowrap\">"
      + '<span>'+esc(number)+'</span>'+(emoji?'<span style="font-size:13px">'+esc(emoji)+'</span>':'')+'</div>';
    return L.divIcon({ className:"marker-pin", iconSize:[0,0], iconAnchor:[0,0], html:html });
  }
  function approxIcon(number, emoji){
    var html = '<div style="display:inline-flex;align-items:center;gap:2px;transform:translate(-50%,-50%);'
      + 'background:rgba(20,18,16,.9);color:#999;border:2px dashed #999;border-radius:9999px;'
      + "padding:2px 8px;font:600 11px/1.2 'Inter',sans-serif;white-space:nowrap\">"
      + '<span>'+esc(number)+'</span>'+(emoji?'<span>'+esc(emoji)+'</span>':'')
      + '<span style="font-size:9px;opacity:.7">추정</span></div>';
    return L.divIcon({ className:"marker-pin", iconSize:[0,0], iconAnchor:[0,0], html:html });
  }
  function noteIcon(emoji){
    var html = '<div style="display:inline-flex;align-items:center;transform:translate(-50%,-50%);'
      + 'background:#181818;color:#999;border:1px solid rgba(255,255,255,.10);border-radius:9999px;'
      + "padding:1px 6px;font:500 12px 'Inter',sans-serif;box-shadow:rgba(0,0,0,.4) 0 1px 3px\">"
      + (esc(emoji)||"📝")+'</div>';
    return L.divIcon({ className:"marker-pin", iconSize:[0,0], iconAnchor:[0,0], html:html });
  }
  function makeIcon(m){
    if(m.icon==="note") return noteIcon(m.emoji);
    if(m.icon==="approxStop"||m.icon==="approxOption") return approxIcon(m.number==null?"":m.number, m.emoji);
    return stopIcon(m.number, m.emoji, m.icon==="optionCand");
  }

  // ── 카드 액센트 (DESIGN: monochrome + 단일 accent. 카테고리 멀티컬러 폐기) ──
  // 모든 stop/note는 ink-muted 액센트, option만 gradient-violet 시그너처.
  var CAT_PALETTE = {
    option:  { bg:"#181818", accent:"#7c5cff" },
    fallback:{ bg:"#181818", accent:"#999999" }
  };

  function gmapAnchorHtml(url){
    if(!url) return "";
    return '<a class="gmap-btn sm" target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">🗺️ 구글 지도</a>';
  }
  function popupHtml(p){
    if(p.kind==="note"){
      var h='<div style="min-width:140px"><div style="font-weight:600">'+esc(p.emoji)+' '+esc(p.text)+'</div>';
      if(p.mode||p.durationMin!=null){
        h+='<div style="font-size:12px;color:#999;margin-top:4px">'+esc(p.mode||"")
          +(p.durationMin!=null?(' · '+esc(p.durationMin)+'분'):'')+'</div>';
      }
      return h+'</div>';
    }
    if(p.kind==="option"){
      return '<div style="min-width:140px"><div style="font:600 11px Inter;color:#7c5cff">택1</div>'
        +'<div style="font-weight:600">'+esc(p.label)+'</div>'
        +(p.durationMin!=null?'<div style="font-size:12px;color:#999;margin-top:2px">⏱ 예상 '+esc(p.durationMin)+'분</div>':'')
        +'<div style="font-size:11px;color:#999;margin-top:2px">좌표 없음 · 근사 위치</div></div>';
    }
    var s='<div style="min-width:160px">';
    if(p.optionLabel) s+='<div style="font:600 11px Inter;color:#7c5cff">'+esc(p.optionLabel)+'</div>';
    s+='<div style="font-weight:600">'+esc(p.title)+'</div>';
    if(p.approx) s+='<div style="font-size:11px;color:#999;margin-top:2px">좌표 없음 · 근사 위치</div>';
    if(p.durationMin!=null) s+='<div style="font-size:12px;color:#999;margin-top:4px">⏱ 예상 '+esc(p.durationMin)+'분</div>';
    if(p.memo) s+='<div style="font-size:13px;color:#fff;margin-top:4px">'+esc(p.memo)+'</div>';
    if(p.tags&&p.tags.length) s+='<div style="font-size:12px;color:#999;margin-top:4px">#'+p.tags.map(esc).join(' #')+'</div>';
    if(p.url) s+='<div>'+gmapAnchorHtml(p.url)+'</div>';
    return s+'</div>';
  }

  // ── 일정별 지도 상태 ──
  var mapState = {}; // itId -> { map, markerByBlock }

  function initMap(container, vm){
    if(!vm.bounds.length){ return null; }
    var map = L.map(container, { scrollWheelZoom:true });
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { subdomains:"abcd", attribution:"&copy; OpenStreetMap &copy; CARTO" }).addTo(map);

    vm.segments.forEach(function(seg){
      L.polyline([seg.a, seg.b], { color:"#ffffff", weight:3, opacity:0.7, dashArray: seg.dashed?"4 6":null }).addTo(map);
    });
    vm.optionConnectors.forEach(function(pts){
      L.polyline(pts, { color:"#7c5cff", weight:2, opacity:0.85, dashArray:"3 5" }).addTo(map);
    });

    var markerByBlock = {};
    vm.markers.forEach(function(m){
      var mk = L.marker([m.lat, m.lng], { icon: makeIcon(m) }).addTo(map);
      mk.bindPopup(popupHtml(m.popup));
      if(!markerByBlock[m.blockId]) markerByBlock[m.blockId] = mk;
    });

    if(vm.bounds.length===1){ map.setView(vm.bounds[0], 15); }
    else { map.fitBounds(L.latLngBounds(vm.bounds), { padding:[40,40] }); }

    requestAnimationFrame(function(){ map.invalidateSize(); });
    var st = { map: map, markerByBlock: markerByBlock };
    mapState[vm.id] = st;
    return st;
  }

  function ensureMap(vm){
    var st = mapState[vm.id];
    if(st){ requestAnimationFrame(function(){ st.map.invalidateSize(); }); return st; }
    var holder = document.getElementById("map-"+vm.id);
    if(!holder) return null;
    return initMap(holder, vm);
  }

  function flyToBlock(vm, row){
    if(!row.hasPoint || !row.flyTo) return;
    var st = ensureMap(vm);
    if(!st) return;
    st.map.flyTo(row.flyTo, Math.max(st.map.getZoom(), 15), { duration:0.6 });
    var mk = st.markerByBlock[row.blockId];
    if(mk) mk.openPopup();
  }

  // ── 아이콘(SVG) ──
  function locateSvg(){
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  }

  // ── 렌더: 체크리스트 ──
  function renderChecklist(panel){
    DATA.checklists.forEach(function(topic){
      var card = el("div","card");
      card.appendChild(txt("h3","topic-title t-card-title", topic.title || "주제"));
      topic.items.forEach(function(item){
        var key = LS_PREFIX + item.id;
        var stored = null;
        try { stored = localStorage.getItem(key); } catch(e){}
        var checked = (stored===null) ? !!item.done : (stored==="1");
        var row = el("label","check-row"+(checked?" done":""));
        var box = el("input"); box.type="checkbox"; box.checked=checked;
        var span = txt("span","t-body-md", item.text);
        box.addEventListener("change", function(){
          try { localStorage.setItem(key, box.checked?"1":"0"); } catch(e){}
          row.className = "check-row"+(box.checked?" done":"");
        });
        row.appendChild(box); row.appendChild(span);
        card.appendChild(row);
      });
      panel.appendChild(card);
    });
    return null;
  }
  function buildChecklistView(){
    var view = el("div","view");
    renderChecklist(view);
    return view;
  }

  function chipText(row){
    if(row.kind==="option") return "택1";
    if(row.kind==="note") return row.mode || "메모";
    return "방문";
  }

  // 타임라인 카드 한 개(좌측 레일 노드 + 우측 카드). 구글맵 버튼은 지도 팝업 전용 → 카드엔 없음.
  function renderCard(vm, row){
    var col = row.kind==="option" ? CAT_PALETTE.option : CAT_PALETTE.fallback;

    var item = el("div","tl-item");
    var rail = el("div","tl-rail");
    var node = el("div","tl-node"); node.style.borderColor = col.accent;
    rail.appendChild(node);
    item.appendChild(rail);

    var card = el(row.hasPoint ? "button" : "div", "tl-card"+(row.kind==="note"?" note":""));
    card.style.borderLeftColor = col.accent; // 카테고리색 = 좌측 액센트만(흰 카드 유지)
    if(row.hasPoint){
      card.type="button"; card.title="지도에서 보기";
      card.addEventListener("click", function(){ flyToBlock(vm, row); });
    }

    var head = el("div","tl-head");
    if(row.number!=null){
      var num = el("span","num"+(row.kind==="option"?" opt":""));
      num.textContent = row.number; head.appendChild(num);
    }
    head.appendChild(txt("span","emoji", row.emoji));
    head.appendChild(txt("span","tl-title", row.title));
    head.appendChild(txt("span","chip", chipText(row)));
    if(row.durationMin!=null) head.appendChild(txt("span","chip dur","⏱ "+row.durationMin+"분"));
    // note는 연결선용(중점) → 추정/좌표없음 배지 미표시
    if(row.kind!=="note"){
      if(row.approx) head.appendChild(txt("span","badge-approx","추정"));
      else if(!row.hasPoint) head.appendChild(txt("span","badge-approx","좌표없음"));
    }
    if(row.hasPoint){ var loc = el("span","locate"); loc.innerHTML = locateSvg(); head.appendChild(loc); }
    card.appendChild(head);

    var detail = el("div","tl-detail");
    if(row.kind==="note"){
      if(row.mode) detail.appendChild(txt("div","meta", row.mode)); // 시간은 헤드 칩에 표시
    } else if(row.kind==="option"){
      row.candidates.forEach(function(c){
        var cd = el("div","cand");
        cd.appendChild(txt("div","cand-title", c.emoji+" "+c.title));
        if(c.memo) cd.appendChild(txt("div","memo", c.memo));
        if(c.tags && c.tags.length) cd.appendChild(txt("div","tags","#"+c.tags.join(" #")));
        detail.appendChild(cd);
      });
    } else {
      if(row.memo) detail.appendChild(txt("div","memo", row.memo));
      if(row.tags && row.tags.length) detail.appendChild(txt("div","tags","#"+row.tags.join(" #")));
    }
    if(detail.childNodes.length) card.appendChild(detail);

    item.appendChild(card);
    return item;
  }

  // ── 일정 view (sticky 지도 → 인트로 → 세로 타임라인) ──
  function buildItineraryView(vm){
    var view = el("div","view");
    var cols = el("div","itin-cols");

    // 좌측(데스크톱) / 상단 이후(모바일): 인트로 + 타임라인
    var main = el("div","itin-main");
    var intro = el("div","itin-intro");
    intro.appendChild(txt("h2","it-title t-heading-md", vm.title || "일정"));
    if(vm.subtitle) intro.appendChild(txt("div","it-sub t-subtitle", vm.subtitle));
    if(vm.description) intro.appendChild(txt("p","it-desc t-body-md", vm.description));
    main.appendChild(intro);
    if(!vm.bounds.length) main.appendChild(txt("div","no-map t-body-sm","표시할 좌표가 없습니다"));
    var tl = el("div","timeline");
    vm.blocks.forEach(function(row){ tl.appendChild(renderCard(vm, row)); });
    main.appendChild(tl);
    cols.appendChild(main);

    // 우측(데스크톱) / 상단(모바일, order:-1): sticky 지도
    if(vm.bounds.length){
      var sticky = el("div","map-sticky");
      var mapDiv = el("div","itin-map"); mapDiv.id = "map-"+vm.id;
      sticky.appendChild(mapDiv);
      sticky.appendChild(txt("div","map-hint","카드를 탭하면 지도가 이동합니다"));
      cols.appendChild(sticky);
    }

    view.appendChild(cols);
    return view;
  }

  // ── 렌더: 가로 선택 네비(체크리스트 맨 앞 + 일정들) + view 전환 ──
  function render(){
    var app = document.getElementById("app");
    var wrap = el("div","wrap");

    var hero = el("div","hero");
    var card = el("div","hero-card");
    card.appendChild(txt("h1","t-hero", DATA.name || "여행 일정"));
    var its = DATA.itineraries.length, chks = DATA.checklists.length;
    card.appendChild(txt("div","hero-tag t-subtitle", "일정 " + its + "개 · 체크리스트 " + chks + "개"));
    hero.appendChild(card);
    wrap.appendChild(hero);

    var nav = el("nav","trip-nav"); nav.setAttribute("role","tablist");
    var host = el("div","view-host");
    var entries = []; // {item, view, onShow}

    function activate(e){
      entries.forEach(function(x){
        var on = (x===e);
        x.item.setAttribute("aria-selected", on?"true":"false");
        x.view.hidden = !on;
      });
      if(e.onShow) requestAnimationFrame(e.onShow);
    }
    function addEntry(kicker, label, viewEl, onShow){
      var item = el("button","nav-item"); item.type="button";
      item.setAttribute("role","tab"); item.setAttribute("aria-selected","false");
      item.appendChild(txt("span","nav-kicker", kicker));
      item.appendChild(txt("span","nav-label", label));
      viewEl.hidden = true;
      var e = { item:item, view:viewEl, onShow:onShow };
      item.addEventListener("click", function(){ activate(e); });
      nav.appendChild(item); host.appendChild(viewEl); entries.push(e);
      return e;
    }

    if(chks) addEntry("✓", "체크리스트", buildChecklistView(), null);
    var firstItin = null;
    DATA.itineraries.forEach(function(vm, idx){
      var e = addEntry(("0"+(idx+1)).slice(-2), vm.title || "일정", buildItineraryView(vm),
        function(){ if(vm.bounds.length) ensureMap(vm); });
      if(idx===0) firstItin = e;
    });

    wrap.appendChild(nav);
    wrap.appendChild(host);

    var f = el("footer"); f.appendChild(txt("div","t-micro","여행 일정 에디터로 생성"));
    wrap.appendChild(f);

    app.appendChild(wrap);

    // 기본 선택: 첫 일정(있으면) → 지도 바로 노출, 없으면 첫 항목(체크리스트)
    if(entries.length) activate(firstItin || entries[0]);
  }

  render();
})();
</script>
</body>
</html>
